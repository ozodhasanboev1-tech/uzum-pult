<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: sticky filter bar → KPI strip → two charts → tabbed working tables. Seller's control desk, dense but calm. */
:root{
  --bg:#f5f5f7;--panel:#ffffff;--line:#e4e3ea;--line2:#efeef3;
  --fg:#17161c;--fg2:#56545f;--fg3:#8a8894;
  --accent:#6a3de8;--accent-soft:#efeafe;--bar:#7b55ee;--bar2:#c9b9fb;
  --good:#12805c;--good-bg:#e3f5ec;--warn:#a86200;--warn-bg:#fdf1dc;--bad:#c2372f;--bad-bg:#fde8e6;
  --font:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121116;--panel:#1b1a21;--line:#2c2a35;--line2:#23222b;--fg:#f1f0f5;--fg2:#b9b6c4;--fg3:#85828f;
  --accent:#9b7dff;--accent-soft:#2a2342;--bar:#9173ff;--bar2:#4a3e7a;
  --good:#4cc493;--good-bg:#173026;--warn:#e9a640;--warn-bg:#352812;--bad:#f07a70;--bad-bg:#3a1c1a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121116;--panel:#1b1a21;--line:#2c2a35;--line2:#23222b;--fg:#f1f0f5;--fg2:#b9b6c4;--fg3:#85828f;
  --accent:#9b7dff;--accent-soft:#2a2342;--bar:#9173ff;--bar2:#4a3e7a;
  --good:#4cc493;--good-bg:#173026;--warn:#e9a640;--warn-bg:#352812;--bad:#f07a70;--bad-bg:#3a1c1a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
.wrap{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:12px 16px}
.bar-row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}
.brand small{font-weight:400;font-size:12px;color:var(--fg3)}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--fg2);padding:6px 11px;border-radius:7px;cursor:pointer}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.dates{display:flex;gap:6px;align-items:center;color:var(--fg3);font-size:13px}
.dates input{font:inherit;font-size:13px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
button:focus-visible,input:focus-visible,select:focus-visible,th:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:18px}
.kpi{background:var(--panel);padding:14px 16px;min-width:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3)}
.kpi .v{font-size:22px;font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--fg2);margin-top:2px}
.kpi .v.neg{color:var(--bad)}
.charts{display:grid;grid-template-columns:3fr 2fr;gap:14px;margin-top:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h3{margin:0;font-size:14px;font-weight:600}
.card .sub{font-size:12px;color:var(--fg3);margin-top:1px}
.chart{position:relative;margin-top:10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--fg3);font-size:10px;font-family:var(--mono)}
.chart .grid{stroke:var(--line2);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-110%);z-index:3}
.tip b{font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:2px;margin-top:22px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-size:14px;background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;color:var(--fg2);cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tabs .cnt{font-size:11px;color:var(--fg3);margin-left:4px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 10px}
.tools input[type=search]{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;flex:1 1 220px;max-width:360px}
.tools label{font-size:13px;color:var(--fg2);display:flex;gap:6px;align-items:center}
.tools input[type=number]{font:inherit;width:64px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:5px 7px}
.note{font-size:12px;color:var(--fg3)}
.tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg3);font-weight:500;position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none}
th.l,td.l{text-align:left}
th[aria-sort] .ar::after{content:" ↓"}
th[aria-sort="ascending"] .ar::after{content:" ↑"}
tbody tr:hover{background:var(--line2)}
tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0;background:var(--panel)}
td.prod{display:flex;gap:10px;align-items:center;white-space:normal;min-width:300px;max-width:440px}
.thumb{width:44px;height:44px;border-radius:7px;object-fit:cover;background:var(--line2);flex:none}
.pt{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pv{font-size:13px;font-weight:600}
.pc{font-size:11px;color:var(--fg3);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;max-width:380px;white-space:nowrap}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;font-weight:500}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.good{background:var(--good-bg);color:var(--good)}.pill.mut{background:var(--line2);color:var(--fg3)}
.neg{color:var(--bad)}
.muted{color:var(--fg3)}
.empty{padding:28px;text-align:center;color:var(--fg3)}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.hbar .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.hbar .fill{height:100%;background:var(--bar);border-radius:3px}
.list{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:13px}
.mp button[aria-pressed="true"].wb{background:#cb11ab}
.seg[hidden],#uzv[hidden],#wbv[hidden],#bv[hidden],#ov[hidden],#yv[hidden],#hv[hidden],#wnv[hidden],#thv[hidden],.dates[hidden]{display:none!important}
.bform{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px;margin-top:12px}.bform label{display:grid;gap:4px;font-size:12px;color:var(--fg2)}.bform input{font:inherit;font-size:14px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}.bform input:invalid{border-color:var(--warn)}.bin{font:inherit;width:96px;text-align:right;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-family:var(--mono)}.bin.q{width:64px}.btn{font:inherit;font-weight:600;font-size:14px;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 16px;cursor:pointer}.btn[disabled]{opacity:.5;cursor:default}.bhead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-top:18px}.bsum{font-size:18px;font-weight:600}#thv .two{align-items:start}#thv .two>.card{min-width:0;overflow-x:auto}#hv .two{align-items:start}#hv .two>.card{min-width:0;overflow-x:auto}#hv .card table{width:100%}#hv .card td.l{white-space:normal}#bv tr:has(+.brsub) td{border-bottom:0}.brsub td{padding-top:0}.tools select{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:5px 7px}
.wbweek dl{display:grid;grid-template-columns:1fr auto;gap:4px 14px;margin:10px 0 0;font-size:13px}.wbweek dt{color:var(--fg2)}.wbweek dd{margin:0;text-align:right;font-family:var(--mono)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.charts,.two{grid-template-columns:1fr}}
@media (max-width:700px){header.bar{position:static}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="bar">
    <div class="bar-row">
      <div class="brand">Uzum Pult <small id="gen">Ma'lumot yuklanmoqda…</small></div>
      <div class="seg mp" id="mp" role="group" aria-label="Marketplace"><button data-v="uz">Uzum</button><button data-v="wb" class="wb">Wildberries</button><button data-v="brak">Brak</button><button data-v="ombor">Pullik ombor</button><button data-v="yi">Yunit iqtisod</button><button data-v="hk">Hisob-kitob</button><button data-v="wn">WB narx</button><button data-v="th">Tahlil</button></div>
      <div class="seg" id="wbcabs" role="group" aria-label="WB kabinetlari" hidden></div>
      <div class="seg" id="shops" role="group" aria-label="Do'konlar"></div>
      <div class="seg" id="presets" role="group" aria-label="Davr"></div>
      <div class="dates" id="dates"><input type="date" id="dfrom" aria-label="Boshlanish sanasi"> – <input type="date" id="dto" aria-label="Tugash sanasi"></div>
    </div>
  </header>
  <div id="errs"></div>

  <div id="uzv">
  <section class="kpis" id="kpis" aria-label="Asosiy ko'rsatkichlar"></section>

  <section class="charts">
    <div class="card"><h3 id="dayH">Kunlik savdo</h3><div class="sub" id="dayTitle">Tushum, so'm</div><div class="chart" id="chDay"></div></div>
    <div class="card"><h3>Soatlar bo'yicha buyurtmalar</h3><div class="sub">Toshkent vaqti, tanlangan davr uchun</div><div class="chart" id="chHour"></div></div>
  </section>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <section id="panel"></section>
  </div>
  <div id="wbv" hidden></div>
  <div id="bv" hidden></div>
  <div id="ov" hidden></div>
  <div id="yv" hidden></div>
  <div id="hv" hidden></div>
  <div id="wnv" hidden></div>
  <div id="thv" hidden></div>
</div>

<script>
(function(){
const TZ=5*3600, DAY=86400;
const $=s=>document.querySelector(s);
const F=n=>Math.round(n).toLocaleString('ru-RU').replace(/,/g,' ');
const FM=n=>{const a=Math.abs(n);return (a>=1e6?(n/1e6).toFixed(a>=1e8?0:1).replace('.',',')+' mln':F(n))};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dkey=ts=>Math.floor((ts+TZ)/DAY);                 // Toshkent kuni
const kdate=k=>new Date(k*DAY*1000);                    // UTC ko'rinishida = Toshkent sanasi
const iso=k=>kdate(k).toISOString().slice(0,10);
const fromIso=s=>Math.floor(Date.parse(s+'T00:00:00Z')/1000/DAY);
const dm=k=>{const d=kdate(k);return String(d.getUTCDate()).padStart(2,'0')+'.'+String(d.getUTCMonth()+1).padStart(2,'0')};
let D,IMG={},WB=null,WBST={cab:-1,sort:['rev',-1],loaded:false},st={mp:'uz',shop:-1,from:0,to:0,preset:'30',tab:'sales',q:'',onlySold:true,target:30,sort:{sales:['q',-1],plan:['days',1],dead:['stock',-1],cards:['rev',1]}};
try{const s=JSON.parse(localStorage.getItem('uzumPult')||'{}');if(s.shop!=null)st.shop=s.shop;if(s.preset)st.preset=s.preset;if(s.tab)st.tab=s.tab;if(s.target)st.target=s.target;if(s.mp)st.mp=s.mp}catch(e){}
const save=()=>{try{localStorage.setItem('uzumPult',JSON.stringify({shop:st.shop,preset:st.preset,tab:st.tab,target:st.target,mp:st.mp}))}catch(e){}};

fetch('data.json?v='+Date.now()).then(r=>r.json()).then(d=>{D=d;return fetch('today.json?v='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)}).then(t=>{if(t)mergeToday(t);init();fetch('imgs.json').then(r=>r.json()).then(m=>{IMG=m;render()}).catch(()=>{})})
 .catch(()=>{$('#gen').textContent='Ma\'lumot topilmadi';});

function mergeToday(T){ // soatlik vazifa yuborgan bugungi buyurtmalar
  const day=dkey(T.day0);if(day<dkey(D.gen))return;
  D.orders=D.orders.filter(o=>dkey(o[0])<day);
  const ix=new Map(D.skus.map((k,i)=>[k.c,i])),cx=new Map(D.causes.map((c,i)=>[c,i]));
  for(const [ts,si,code,title,pid,stt,q,sp,pr,pp,com,lg,rq,cause] of T.orders){
    let i=ix.get(code);if(i==null){i=D.skus.length;D.skus.push({s:si,pid,c:code,t:title,v:String(code||'').split('-').pop(),fbo:0,fbs:0,p:sp,ar:false,im:''});ix.set(code,i)}
    let c=-1;if(rq>0){c=cx.get(cause);if(c==null){c=D.causes.length;D.causes.push(cause);cx.set(cause,c)}}
    D.orders.push([ts,i,stt,q,sp,pr,pp,com,lg,rq,c,0]);
  }
  D.tgen=T.gen;
}
function init(){
  const g=new Date((D.gen+TZ)*1000);
  D.today=Math.max(dkey(D.gen),D.tgen?dkey(D.tgen):0);D.min=dkey(D.gen)-D.days;
  const hm=ts=>new Date((ts+TZ)*1000).toISOString().slice(11,16);
  $('#gen').textContent=(D.tgen&&dkey(D.tgen)===D.today?'Bugungi sotuv: '+hm(D.tgen)+' holatiga · ':'')+'Ostatka va tarix: '+new Date((D.gen+TZ)*1000).toISOString().slice(0,16).replace('T',' ');
  const errs=D.shops.filter(s=>s.err);if(errs.length)$('#errs').innerHTML=errs.map(s=>`<div class="err">${esc(s.n)}: ma'lumot olinmadi (${esc(s.err)})</div>`).join('');
  $('#shops').innerHTML=[['-1','Hammasi']].concat(D.shops.map((s,i)=>[String(i),s.n])).map(([v,n])=>`<button data-v="${v}">${esc(n)}</button>`).join('');
  $('#shops').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.shop=+b.dataset.v;save();render()};
  const P=[['0','Bugun'],['1','Kecha'],['7','7 kun'],['30','30 kun'],['m','Shu oy'],['pm',"O'tgan oy"],['90','90 kun']];
  $('#presets').innerHTML=P.map(([v,n])=>`<button data-v="${v}">${n}</button>`).join('');
  $('#presets').onclick=e=>{const b=e.target.closest('button');if(!b)return;setPreset(b.dataset.v);save();render()};
  for(const id of ['dfrom','dto']){const el=$('#'+id);el.min=iso(D.min);el.max=iso(D.today);el.onchange=()=>{const a=fromIso($('#dfrom').value),b=fromIso($('#dto').value);if(!isNaN(a)&&!isNaN(b)&&a<=b){st.from=Math.max(a,D.min);st.to=b;st.preset='';render()}}}
  const T=[['sales','Sotuv va ostatka'],['plan','Zaxira rejasi'],['dead','Nelikvid'],['ret','Vozvratlar'],['cards','Kartochkalar'],['exp','Rasxodlar']];
  $('#tabs').innerHTML=T.map(([v,n])=>`<button role="tab" data-v="${v}">${n}<span class="cnt" id="c_${v}"></span></button>`).join('');
  $('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.tab=b.dataset.v;save();render()};
  if(st.shop>=D.shops.length)st.shop=-1;
  if(location.hash==='#bugun')st.preset='0';
  if(location.hash==='#wb')st.mp='wb';
  if(location.hash==='#brak')st.mp='brak';
  if(location.hash==='#ombor')st.mp='ombor';
  if(location.hash==='#yunit')st.mp='yi';
  if(location.hash==='#hisob')st.mp='hk';
  if(location.hash==='#wbnarx')st.mp='wn';
  if(location.hash==='#tahlil')st.mp='th';
  $('#mp').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.mp=b.dataset.v;save();render()};
  setPreset(st.preset||'30');render();
}
function setPreset(p){
  const t=D.today;st.preset=p;
  if(p==='0'){st.from=t;st.to=t}
  else if(p==='1'){st.from=t-1;st.to=t-1}
  else if(p==='m'){const d=kdate(t);st.from=fromIso(d.toISOString().slice(0,8)+'01');st.to=t}
  else if(p==='pm'){const d=kdate(t);const f=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()-1,1));const l=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),0));st.from=fromIso(f.toISOString().slice(0,10));st.to=fromIso(l.toISOString().slice(0,10))}
  else{const n=+p||30;st.from=t-n;st.to=t-1}
  st.from=Math.max(st.from,D.min);
}
const inShop=s=>st.shop<0||s===st.shop;
const skuImg=k=>IMG[k.im]||'';

/* ---------- agregatlar ---------- */
function agg(){
  const S=D.skus,a=st.from,b=st.to;
  const per=new Map(),days=new Map(),hours=new Array(24).fill(0),causes=new Map();
  const tot={q:0,ord:new Set(),rev:0,pay:0,cost:0,miss:0,com:0,log:0,ret:0,retSum:0};
  for(const o of D.orders){
    const k=S[o[1]];if(!inShop(k.s))continue;const dk=dkey(o[0]);if(dk<a||dk>b)continue;
    const [ts,si,stt,q,sp,pr,pp,com,lg,rq,rc]=o;
    let r=per.get(si);if(!r){r={q:0,rev:0,pay:0,cost:0,ret:0,miss:0};per.set(si,r)}
    r.q+=q;r.rev+=q*sp;r.pay+=pr;r.cost+=q*pp;r.ret+=rq;if(q&&!pp)r.miss+=q;
    tot.q+=q;tot.rev+=q*sp;tot.pay+=pr;tot.cost+=q*pp;tot.com+=com;tot.log+=lg;tot.ret+=rq;tot.retSum+=rq*sp;if(q&&!pp)tot.miss+=q;
    if(q>0){tot.ord.add(ts+'_'+si);const dd=days.get(dk)||{rev:0,q:0};dd.rev+=q*sp;dd.q+=q;days.set(dk,dd);hours[Math.floor(((ts+TZ)%DAY)/3600)]++}
    if(rq>0&&rc>=0){const c=D.causes[rc];causes.set(c,(causes.get(c)||0)+rq)}
  }
  const ex=new Map();let exT=0;
  for(const e of D.exps){if(!inShop(e[1]))continue;const dk=dkey(e[0]);if(dk<a||dk>b)continue;ex.set(D.srcs[e[2]],(ex.get(D.srcs[e[2]])||0)+e[3]);exT+=e[3]}
  return {per,days,hours,causes,tot,ex,exT};
}
function last30(){ // zaxira hisobi uchun: kechagacha 30 kun
  const s30=new Map(),rev30=new Map(),a=D.today-30,b=D.today-1;
  for(const o of D.orders){const dk=dkey(o[0]);if(dk<a||dk>b||!o[3])continue;s30.set(o[1],(s30.get(o[1])||0)+o[3]);const pid=D.skus[o[1]].pid;rev30.set(pid,(rev30.get(pid)||0)+o[3]*o[4])}
  return {s30,rev30};
}

function barChart(el,data,{h=190,fmt,label,tipf}){
  const W=640,pl=44,pr=6,pt=10,pb=22,n=data.length||1,max=Math.max(1,...data.map(d=>d.v));
  const step=niceStep(max),top=Math.ceil(max/step)*step,bw=(W-pl-pr)/n,gap=Math.min(2,bw*.2);
  let s=`<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(label)}">`;
  for(let v=0;v<=top;v+=step){const y=pt+(h-pt-pb)*(1-v/top);s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-6}" y="${y+3}" text-anchor="end">${fmt(v)}</text>`}
  const every=Math.ceil(n/12);
  data.forEach((d,i)=>{const x=pl+i*bw+gap/2,w=Math.max(1,bw-gap),bh=(h-pt-pb)*d.v/top,y=h-pb-bh;
    const r=Math.min(4,w/2,bh);
    s+=bh>0?`<path d="M${x},${h-pb}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${h-pb}Z" fill="${d.dim?'var(--bar2)':'var(--bar)'}"/>`:'';
    s+=`<rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${h-pt-pb}" fill="transparent" data-i="${i}"/>`;
    if(i%every===0)s+=`<text class="ax" x="${x+w/2}" y="${h-6}" text-anchor="middle">${esc(d.k)}</text>`});
  el.innerHTML=s+'</svg><div class="tip" hidden></div>';
  const tip=el.querySelector('.tip'),svg=el.querySelector('svg');
  svg.onmousemove=e=>{const i=e.target.dataset?.i;if(i==null){tip.hidden=true;return}const d=data[+i],r=el.getBoundingClientRect();tip.innerHTML=tipf(d);tip.hidden=false;tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px'};
  svg.onmouseleave=()=>tip.hidden=true;
}
function niceStep(m){const r=m/4,p=Math.pow(10,Math.floor(Math.log10(r))),f=r/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function drawDays(A){
  if(st.from===st.to){ // bitta kun: soatlik tushum
    const hr=new Array(24).fill(0),hq=new Array(24).fill(0);
    for(const o of D.orders){const k=D.skus[o[1]];if(!inShop(k.s)||!o[3])continue;if(dkey(o[0])!==st.from)continue;const h=Math.floor(((o[0]+TZ)%DAY)/3600);hr[h]+=o[3]*o[4];hq[h]+=o[3]}
    barChart($('#chDay'),hr.map((v,i)=>({k:String(i).padStart(2,'0'),v,q:hq[i]})),{label:'Soatlik tushum',fmt:v=>v>=1e6?(v/1e6)+'m':v>=1e3?(v/1e3)+'k':v,tipf:d=>`<b>${d.k}:00–${d.k}:59</b> · ${F(d.v)} so'm · ${F(d.q)} dona`});
    $('#dayH').textContent='Soatlik savdo';$('#dayTitle').textContent="Soat bo'yicha tushum, so'm · "+iso(st.from).split('-').reverse().join('.');return;
  }
  const data=[];for(let k=st.from;k<=st.to;k++){const d=A.days.get(k)||{rev:0,q:0};const wd=kdate(k).getUTCDay();data.push({k:dm(k),v:d.rev,q:d.q,dim:wd===0||wd===6,day:k})}
  barChart($('#chDay'),data,{label:'Kunlik savdo',fmt:v=>v>=1e6?(v/1e6)+'m':v>=1e3?(v/1e3)+'k':v,tipf:d=>`<b>${iso(d.day).split('-').reverse().join('.')}</b> · ${F(d.v)} so'm · ${F(d.q)} dona`});
  $('#dayH').textContent='Kunlik savdo';$('#dayTitle').textContent="Tushum, so'm · dam olish kunlari och rangda";
}
function drawHours(A){
  const data=A.hours.map((v,i)=>({k:String(i).padStart(2,'0'),v}));
  barChart($('#chHour'),data,{label:"Soatlar bo'yicha buyurtmalar",fmt:v=>v,tipf:d=>`<b>${d.k}:00–${d.k}:59</b> · ${F(d.v)} ta buyurtma`});
}

function prodCell(k){const im=skuImg(k);return `<td class="l prod">${im?`<img class="thumb" src="${im}" alt="" loading="lazy">`:'<span class="thumb"></span>'}<div style="min-width:0"><div class="pt">${esc(k.t)}</div><div class="pv">${esc(k.v)}</div><div class="pc">${esc(k.c)} · ${esc(D.shops[k.s].n)}</div></div></td>`}
function sortRows(rows,key){const [f,dir]=st.sort[key];return rows.sort((x,y)=>{const a=x[f],b=y[f];return (typeof a==='string'?a.localeCompare(b):(a-b))*dir})}
function head(key,cols){const [f,dir]=st.sort[key];return '<thead><tr>'+cols.map(([id,n,cls])=>`<th class="${cls||''}" data-k="${id}" tabindex="0" ${id===f?`aria-sort="${dir>0?'ascending':'descending'}"`:''}><span class="ar">${n}</span></th>`).join('')+'</tr></thead>'}
function bindSort(key){const t=$('#panel thead');if(!t)return;const go=e=>{const th=e.target.closest('th');if(!th||!th.dataset.k||th.dataset.k==='_')return;const s=st.sort[key];s[1]=s[0]===th.dataset.k?-s[1]:-1;s[0]=th.dataset.k;render()};t.onclick=go;t.onkeydown=e=>{if(e.key==='Enter')go(e)}}
function tools(extra){return `<div class="tools"><input type="search" id="q" placeholder="Tovar, variant yoki kod bo'yicha qidirish" value="${esc(st.q)}" aria-label="Qidirish">${extra||''}</div>`}
function bindQ(){const q=$('#q');if(!q)return;q.oninput=()=>{st.q=q.value;const p=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}}
const match=k=>!st.q||(k.t+' '+k.v+' '+k.c).toLowerCase().includes(st.q.toLowerCase());
function daysPill(d,avg){if(!avg)return '<span class="pill mut">sotuv yo\'q</span>';const t=d===Infinity?'∞':Math.round(d)+' kun';return `<span class="pill ${d<7?'bad':d<14?'warn':'good'}">${t}</span>`}
function stockOf(k){const fm=D.shops[k.s].fbo;return fm?k.fbo:k.fbs}

function tabCounts(A){
  const L=st.L;let plan=0,dead=0;
  D.skus.forEach((k,i)=>{if(!inShop(k.s)||k.ar)return;const s=L.s30.get(i)||0,stock=stockOf(k);if(s>=2&&stock/(s/30)<st.target)plan++;if(!s&&stock>0)dead++});
  let sold=0;for(const [,r] of A.per)if(r.q>0)sold++;
  return {sales:sold,plan,dead,ret:F(A.tot.ret)};
}
function tSales(A){
  const L=st.L,rows=[];
  D.skus.forEach((k,i)=>{if(!inShop(k.s)||!match(k))return;const p=A.per.get(i)||{q:0,rev:0,pay:0,cost:0,ret:0,miss:0};
    if(st.onlySold?!p.q:(!p.q&&!k.fbo&&!k.fbs))return;const s30=L.s30.get(i)||0,avg=s30/30,stock=stockOf(k);
    rows.push({k,i,q:p.q,fbo:k.fbo,fbs:k.fbs,rev:p.rev,pay:p.pay,net:p.pay-p.cost,miss:p.miss,ret:p.ret,days:avg?stock/avg:Infinity,avg,t:k.t})});
  sortRows(rows,'sales');
  const T=rows.reduce((a,r)=>{a.q+=r.q;a.fbo+=r.fbo;a.fbs+=r.fbs;a.rev+=r.rev;a.pay+=r.pay;a.net+=r.net;a.ret+=r.ret;return a},{q:0,fbo:0,fbs:0,rev:0,pay:0,net:0,ret:0});
  $('#panel').innerHTML=tools(`<label><input type="checkbox" id="only" ${st.onlySold?'checked':''}> Faqat sotilganlar</label><span class="note">${rows.length} variant · zaxira 30 kunlik o'rtacha sotuvga ko'ra</span>`)+
  `<div class="tbl-wrap"><table>${head('sales',[['t','Tovar va variant','l'],['q','Sotildi'],['ret','Vozvrat'],['fbo','Uzum skladi'],['fbs','FBS'],['rev','Tushum'],['pay',"To'lovga"],['net','Sof foyda'],['days','Yetadi']])}<tbody>`+
  (rows.slice(0,400).map(r=>`<tr>${prodCell(r.k)}<td class="num">${F(r.q)}</td><td class="num ${r.ret?'':'muted'}">${F(r.ret)}</td><td class="num">${F(r.fbo)}</td><td class="num">${F(r.fbs)}</td><td class="num">${F(r.rev)}</td><td class="num">${F(r.pay)}</td><td class="num ${r.net<0?'neg':''}">${r.miss&&r.miss===r.q?'<span class="muted">—</span>':F(r.net)}</td><td>${daysPill(r.days,r.avg)}</td></tr>`).join('')||`<tr><td colspan="9" class="empty">Bu davrda sotuv yo'q</td></tr>`)+
  `</tbody><tfoot><tr><td class="l">Jami</td><td class="num">${F(T.q)}</td><td class="num">${F(T.ret)}</td><td class="num">${F(T.fbo)}</td><td class="num">${F(T.fbs)}</td><td class="num">${F(T.rev)}</td><td class="num">${F(T.pay)}</td><td class="num ${T.net<0?'neg':''}">${F(T.net)}</td><td></td></tr></tfoot></table></div>`+
  (rows.length>400?`<p class="note">Birinchi 400 ta ko'rsatildi. Qidiruvdan foydalaning.</p>`:'');
  $('#only').onchange=e=>{st.onlySold=e.target.checked;render()};bindQ();bindSort('sales');
}
function tPlan(){
  const L=st.L,rows=[];
  D.skus.forEach((k,i)=>{if(!inShop(k.s)||k.ar||!match(k))return;const s=L.s30.get(i)||0;if(s<2)return;const avg=s/30,stock=stockOf(k),days=stock/avg;if(days>=st.target)return;
    rows.push({k,t:k.t,s30:s,avg,stock,fbs:k.fbs,days,ship:Math.max(0,Math.ceil(avg*st.target-stock)),fbo:D.shops[k.s].fbo})});
  sortRows(rows,'plan');

  (Object.keys(byShop).length?`<p class="note" style="margin:0 0 10px">Jami olib borish/to'ldirish: ${Object.entries(byShop).map(([n,v])=>`<b>${esc(n)}</b> ${F(v)} dona`).join(' · ')}</p>`:'')+

  `</tbody></table></div>`;
  $('#tgt').onchange=e=>{const v=+e.target.value;if(v>=7&&v<=120){st.target=v;save();render()}};bindQ();bindSort('plan');

function tDead(){
  const L=st.L,rows=[];
  D.skus.forEach((k,i)=>{if(!inShop(k.s)||k.ar||!match(k))return;const stock=stockOf(k);if((L.s30.get(i)||0)>0||stock<=0)return;rows.push({k,t:k.t,stock,val:stock*k.p,ps:k.ps||0,psd:(k.ps||0)*stock})});
  sortRows(rows,'dead');
  const tv=rows.reduce((a,r)=>a+r.val,0),tp=rows.reduce((a,r)=>a+r.psd,0);

  `<div class="tbl-wrap"><table>${head('dead',[['t','Tovar va variant','l'],['stock','Qoldiq'],['val',"Narxi bo'yicha"],['ps','Saqlash, 1 dona/kun'],['psd','Saqlash, jami/kun']])}<tbody>`+

function omData(){

  for(const o of D.orders){const dk=dkey(o[0]);if(dk<t-30||dk>t-1||!(o[3]>0))continue;s30.set(o[1],(s30.get(o[1])||0)+o[3])}

    if(OM.q&&!(k.t+' '+k.v+' '+k.c+' '+(k.bc||'')+' '+k.pid).toLowerCase().includes(OM.q.toLowerCase()))return;
    const s=s30.get(i)||0,avg=s/30,days=avg?k.fbo/avg:Infinity;

      act:!s?'qaytar':days>60?'ortiq':'ok'})});

  if(oi>=0)for(const e of D.exps){if(e[2]!==oi||(OM.shop>=0&&e[1]!==OM.shop))continue;const k=dkey(e[0]);day.set(k,(day.get(k)||0)+e[3])}

const TH={mp:'uz',shop:-1,per:'30',msg:''};
function thRange(){const y=D.today-1;
  if(TH.per==='7')return [[y-6,y],[y-13,y-7]];
  if(TH.per==='30')return [[y-29,y],[y-59,y-30]];
  if(TH.per==='m'){const d=kdate(y),f=fromIso(d.toISOString().slice(0,8)+'01'),n=y-f;const pd=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()-1,1)),pf=fromIso(pd.toISOString().slice(0,10));
    const pl=fromIso(new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),0)).toISOString().slice(0,10));return [[f,y],[pf,Math.min(pf+n,pl)]]}
  if(TH.per==='pm'){const d=kdate(D.today),cf=fromIso(d.toISOString().slice(0,8)+'01'),e=cf-1,f=fromIso(kdate(e).toISOString().slice(0,8)+'01');
    const pe=f-1,pf=fromIso(kdate(pe).toISOString().slice(0,8)+'01');return [[f,e],[pf,pe]]}
  return [[y-29,y],[y-59,y-30]];
}
// Uzum: SKU bo'yicha ikki davr
function thUzum([a1,b1],[a0,b0]){
  const S=new Map(),z=()=>({q1:0,q0:0,r1:0,r0:0,pay1:0,pay0:0,ret1:0,ret0:0,c1:0,c0:0,n1:0,n0:0});
  for(const o of D.orders){const k=D.skus[o[1]];if(TH.shop>=0&&k.s!==TH.shop)continue;const d=dkey(o[0]);const p=d>=a1&&d<=b1?1:d>=a0&&d<=b0?0:-1;if(p<0)continue;
    const s=S.get(o[1])||z();s['n'+p]++;if(o[2]===0){s['c'+p]++}else{s['q'+p]+=o[3];s['r'+p]+=o[3]*o[4];s['pay'+p]+=o[5]}s['ret'+p]+=o[9]||0;S.set(o[1],s)}
  return [...S].map(([i,s])=>{const k=D.skus[i];return {key:i,name:k.t,var:k.v,code:k.c,shop:D.shops[k.s].n,img:skuImg(k),stock:(k.fbo||0)+(k.fbs||0),price:k.p||0,ar:k.ar,...s}})
}
// WB: nmID bo'yicha (kunlik sotuvlar, so'mda)
function thWB([a1,b1],[a0,b0]){
  const S=new Map(),z=()=>({q1:0,q0:0,r1:0,r0:0,pay1:0,pay0:0,ret1:0,ret0:0,c1:0,c0:0,n1:0,n0:0});
  for(const [ds,ci,nm,q,rq,uzs] of WB.rows||[]){if(TH.shop>=0&&ci!==TH.shop)continue;const d=fromIso(ds);const p=d>=a1&&d<=b1?1:d>=a0&&d<=b0?0:-1;if(p<0)continue;
    const s=S.get(nm)||z();s['q'+p]+=q-rq;s['r'+p]+=uzs;s['ret'+p]+=rq;S.set(nm,s)}
  for(const o of WB.ords||[]){if(TH.shop>=0&&o[1]!==TH.shop)continue;const d=dkey(o[0]);const p=d>=a1&&d<=b1?1:d>=a0&&d<=b0?0:-1;if(p<0||!o[4])continue;const s=S.get(o[2])||z();s['c'+p]++;S.set(o[2],s)}
  return [...S].map(([nm,s])=>{const it=WB.items[String(nm)]||{};return {key:nm,name:it.t||'',var:it.vc||String(nm),code:String(nm),shop:WB.cabs[it.c]||'',img:WB.imgs&&WB.imgs[String(nm)],stock:null,price:it.pr?it.pr[2]:0,...s}})
}
function thAnalyze(rows){
  const T={r1:0,r0:0,q1:0,q0:0,vol:0,pr:0,nw:0,lost:0,ret1:0,ret0:0,c1:0,c0:0,n1:0,n0:0};
  for(const r of rows){for(const k of ['r1','r0','q1','q0','ret1','ret0','c1','c0','n1','n0'])T[k]+=r[k];
    r.p1=r.q1>0?r.r1/r.q1:0;r.p0=r.q0>0?r.r0/r.q0:0;r.d=r.r1-r.r0;r.vol=0;r.pe=0;r.tags=[];
    if(r.q0>0&&r.q1>0){r.vol=(r.q1-r.q0)*r.p0;r.pe=(r.p1-r.p0)*r.q1;T.vol+=r.vol;T.pr+=r.pe}
    else if(r.q1>0){T.nw+=r.r1;r.tags.push(['new','Yangi sotuvga chiqdi / o\'tgan davrda sotilmagan'])}
    else if(r.q0>0){T.lost+=-r.r0}
    const dp=r.p0?r.p1/r.p0-1:0,dq=r.q0?r.q1/r.q0-1:0;
    if(r.d<0){

   `<div class="tbl-wrap"><table><thead><tr>${cols.map(([id,n,c])=>`<th class="${c||''}" data-k="${id}" tabindex="0" ${id===sf?`aria-sort="${sd>0?'ascending':'descending'}"`:''}><span class="ar">${n}</span></th>`).join('')}</tr></thead><tbody>`+
   (rows.map(r=>`<tr><td class="l prod">${r.img?`<img class="thumb" src="${r.img}" alt="" loading="lazy">`:'<span class="thumb" style="display:grid;place-items:center;font-size:11px;font-weight:700;color:#cb11ab">WB</span>'}<div style="min-width:0"><div class="pv">${esc(r.vc)}</div><div class="pt">${esc(r.t)}</div><div class="pc">${esc(r.c)} · <a href="https://www.wildberries.ru/catalog/${r.nm}/detail.aspx" target="_blank" rel="noopener" style="color:var(--accent)">${r.nm}</a></div></div></td>`+
     `<td class="num">${F(r.q)}</td><td class="num ${r.ret?'':'muted'}">${F(r.ret)}</td><td class="num">${F(r.rev)}</td><td class="num">${F(r.pay)}</td><td class="num">${r.nocost?'<span class="muted">yo\'q</span>':F(r.cost)}</td><td class="num ${r.net<0?'neg':''}">${r.nocost?'<span class="muted">—</span>':F(r.net)}</td></tr>`).join('')||`<tr><td colspan="7" class="empty">Bu davrda WB sotuvi yo'q</td></tr>`)+
   `</tbody><tfoot><tr><td class="l">Jami</td><td class="num">${F(T.q)}</td><td class="num">${F(T.ret)}</td><td class="num">${F(T.rev)}</td><td class="num">${F(T.pay)}</td><td class="num">${F(T.cost)}</td><td class="num ${net<0?'neg':''}">${F(net)}</td></tr></tfoot></table></div>`;
  barChart($('#wbDay'),data,{label:'WB kunlik savdo',fmt:v=>v>=1e6?(v/1e6)+'m':v>=1e3?(v/1e3)+'k':v,tipf:d=>`<b>${iso(d.day).split('-').reverse().join('.')}</b> · ${F(d.v)} so'm · ${F(d.q)} dona`});
  const th=$('#wbv thead');const go=e=>{const h=e.target.closest('th');if(!h)return;const s=WBST.sort;s[1]=s[0]===h.dataset.k?-s[1]:-1;s[0]=h.dataset.k;render()};th.onclick=go;th.onkeydown=e=>{if(e.key==='Enter')go(e)};
}
})();
</script>
